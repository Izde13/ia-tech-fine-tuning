[project]
name = "ia-tech-fine-tuning"
version = "0.1.0"
description = "Fine-tuning con LoRA de un LLM pre-entrenado, sobre el corpus de la Polla Mundial 2026"
readme = "README.md"
authors = [
    { name = "Izde13", email = "izsackdelosra@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "peft>=0.20.0",
    "psutil>=7.2.2",
    "torch>=2.13.0",
    "transformers>=5.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
